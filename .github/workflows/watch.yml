name: market-sentinel
on:
  schedule:
    # GitHub honours maybe 3% of a "*/5" schedule -- observed cadence was ~159
    # minutes, not 5. This cron is no longer the heartbeat; it is the RESTARTER.
    # The job below loops internally for ~5.6h, and the concurrency group holds
    # one queued run pending the whole time, so whichever scheduled tick lands
    # next starts the moment the current job exits. One surviving tick per 5.6h
    # is a bar GitHub clears easily.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]         # PAT pushes kick a run; bot GITHUB_TOKEN commits do NOT

permissions:
  contents: write

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      # The Actions API is not reachable from the analysis session (403: repo
      # not enabled for that session), so run outcomes were invisible from the
      # place the diagnosis happens. This step lets the sentinel report its own
      # history INTO the repo, where it can be read like any other data file.
      # GITHUB_TOKEN works here even though the external session's token does not.
      - name: Record recent run history
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=60" \
            --jq '[.workflow_runs[] | {id, n: .run_number, ev: .event, st: .status,
                   concl: .conclusion, start: .run_started_at, upd: .updated_at}]' \
            > data/run_log.json || echo '[]' > data/run_log.json
          python3 - <<'PY'
          import json,collections
          try: r=json.load(open('data/run_log.json'))
          except Exception: r=[]
          c=collections.Counter((x.get('ev'),x.get('concl') or x.get('st')) for x in r)
          print(f"last {len(r)} runs by (event, conclusion):")
          for k,v in c.most_common(): print(f"  {k}: {v}")
          PY

      - name: Sample loop
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # `bash` not `bash -e {0}` -- see the header of the script. Re-arming
        # errexit here would resurrect the bug the script was written to avoid.
        shell: bash {0}
        run: bash scripts/sample_loop.sh
