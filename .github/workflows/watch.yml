name: market-sentinel
on:
  schedule:
    # GitHub honours maybe 3% of a "*/5" schedule -- observed cadence was ~159
    # minutes, not 5. This cron is no longer the heartbeat; it is the RESTARTER.
    # The job below loops internally for ~5.6h, and the concurrency group holds
    # one queued run pending the whole time, so whichever scheduled tick lands
    # next starts the moment the current job exits. One surviving tick per 5.6h
    # is a bar GitHub clears easily.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]         # PAT pushes kick a run; bot GITHUB_TOKEN commits do NOT

permissions:
  contents: write

concurrency:
  group: sentinel
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Sample loop
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -u
          git config user.name  "sentinel-bot"
          git config user.email "sentinel@users.noreply.github.com"

          START=$(date +%s)
          BUDGET=$((335 * 60))       # leave ~15 min of headroom under the 350 timeout
          CYCLE=300                  # 5 minutes

          while :; do
            NOW=$(date +%s)
            [ $((NOW - START)) -ge $BUDGET ] && { echo "budget spent, exiting for the next run"; break; }

            # A failing watcher must not kill the loop -- one bad upstream response
            # should cost one sample, not 5.6 hours of coverage.
            python3 watcher.py || echo "watcher.py exited $? -- continuing"

            git add data/
            if git diff --cached --quiet; then
              echo "no data change"
            else
              git commit -q -m "sample $(date -u +%Y-%m-%dT%H:%M)"
              for i in 1 2 3; do git push -q && break || git pull --rebase -q; done
            fi

            # sleep to the next cycle boundary, not a flat 300s, so drift does not
            # accumulate over 68 iterations
            SPENT=$(( $(date +%s) - NOW ))
            [ $SPENT -lt $CYCLE ] && sleep $((CYCLE - SPENT))
          done
